
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrays, DOM e Eventos</title>
</head>

<body>

    <!-- ==========================================
         TÍTULO
    =========================================== -->

    <h1 id="titulo">Meu Blog</h1>


    <!-- ==========================================
         PARÁGRAFOS
    =========================================== -->

    <p class="texto">
        Este é o primeiro parágrafo do projeto.
    </p>

    <p class="texto">
        Este é o segundo parágrafo do projeto.
    </p>

    <p class="texto">
        Este é o terceiro parágrafo do projeto.
    </p>


    <!-- ==========================================
         LISTA
    =========================================== -->

    <h2>Lista de tarefas</h2>

    <ul id="lista">

        <!--
            Estes três itens serão utilizados
            no exercício de Event Delegation.
        -->
        <li>Tarefa inicial 1</li>
        <li>Tarefa inicial 2</li>
        <li>Tarefa inicial 3</li>

    </ul>


    <!-- ==========================================
         CAMPO DE NOME
    =========================================== -->

    <h2>Digite seu nome</h2>

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
    >


    <!-- ==========================================
         BOTÃO
    =========================================== -->

    <h2>Botão de teste</h2>

    <button id="botao">
        Clique aqui
    </button>


    <!-- ==========================================
         FORMULÁRIO
    =========================================== -->

    <h2>Adicionar tarefa</h2>

    <form id="formulario">

        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma nova tarefa"
        >

        <button type="submit">
            Adicionar tarefa
        </button>

    </form>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="app.js"></script>

</body>

</html>
